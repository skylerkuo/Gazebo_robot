moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
    - gen3_lite_2f_gripper_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    action_ns: follow_joint_trajectory
    default: true
  gen3_lite_2f_gripper_controller:
    type: GripperCommand
    # Closing onto an object completes via the controller's stall detector, which
    # needs settling time beyond the free-motion trajectory's estimated duration.
    allowed_goal_duration_margin: 3.0
    joints:
      - right_finger_bottom_joint
    action_ns: gripper_cmd
    default: true
