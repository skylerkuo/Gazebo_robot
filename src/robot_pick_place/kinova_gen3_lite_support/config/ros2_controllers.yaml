controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gen3_lite_2f_gripper_controller:
      type: position_controllers/GripperActionController
joint_trajectory_controller:
  ros__parameters:
    joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    # MTC Cartesian stage boundaries may carry small nonzero terminal velocities.
    # Match the existing myCobot simulation controller contract.
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
gen3_lite_2f_gripper_controller:
  ros__parameters:
    joint: right_finger_bottom_joint
    allow_stalling: true
    stall_timeout: 1.0
    goal_tolerance: 0.02
    max_effort: 10.0
