mtc_node:
  ros__parameters:
    object_name: drink_can
    object_type: cylinder
    object_reference_frame: base_link
    object_dimensions:
    - 0.1
    - 0.02
    object_pose:
    - 0.30
    - -0.02
    - 0.05
    - 0.0
    - 0.0
    - 0.0
    place_pose:
    - 0.25
    - -0.52
    - 0.18
    - 0.0
    - 0.0
    - 0.0
    max_solutions: 5
    cartesian_step_size: 0.002
    approach_object_max_dist: 0.12
    lift_object_max_dist: 0.08
    lower_object_max_dist: 0.08
    retreat_max_distance: 0.08
    grasp_pose_min_solution_distance: 0.2
    # Release above the rim; gravity drops the object into the open bin.
    drop_into_bin: true
    bin_pose: [0.25, -0.52, 0.0, 0.0, 0.0, 0.0]
    bin_dimensions: [0.32, 0.22, 0.10]
    bin_wall_thickness: 0.01
