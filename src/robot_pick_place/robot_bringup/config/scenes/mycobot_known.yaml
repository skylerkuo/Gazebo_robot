# ROS parameter overrides. Pose is the primitive center; all lengths are meters.
mtc_node:
  ros__parameters:
    object_name: red_cylinder
    object_type: cylinder
    object_reference_frame: world
    # model.sdf collision radius=0.015; visual radius=0.0125. Use collision geometry.
    object_dimensions: [0.35, 0.015]
    object_pose: [0.22, 0.12, 0.175, 0.0, 0.0, 0.0]
    support_surface_name: support_surface
    support_surface_reference_frame: world
    # Finite pickup ground patch, outside the below-origin robot base collision box.
    support_surface_dimensions: [0.35, 0.35, 0.01]
    support_surface_pose: [0.25, 0.15, -0.005, 0.0, 0.0, 0.0]
    # Original place target (surface height; MTC adds oriented half-height).
    place_pose: [-0.183, -0.14, 0.0, 0.0, 0.0, 0.0]
