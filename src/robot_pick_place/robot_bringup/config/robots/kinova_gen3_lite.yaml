schema_version: 1
robot_id: kinova_gen3_lite
simulation:
  package: kinova_gen3_lite_support
  launch_file: gazebo.launch.py
  world_file: pick_place.sdf
  arguments: {}
robot_description:
  package: kinova_gen3_lite_support
  launch_file: robot_state_publisher.launch.py
  xacro_file: urdf/gen3_lite.urdf.xacro
  mappings: {}
moveit:
  package: kinova_gen3_lite_support
  launch_file: move_group.launch.py
  config_argument: moveit_config_file
  robot_name: gen3_lite_gen3_lite_2f
  files:
    semantic: config/gen3_lite.srdf
    kinematics: config/kinematics.yaml
    joint_limits: config/joint_limits.yaml
    controllers: config/moveit_controllers.yaml
    ros2_controllers: config/ros2_controllers.yaml
    controllers_template: config/ros2_controllers.yaml
    cartesian_limits: config/pilz_cartesian_limits.yaml
  pipelines:
    ompl: config/ompl_planning.yaml
planning:
  arm_group: arm
  gripper_group: gripper
  end_effector: end_effector
  ik_frame: end_effector_link
  base_frame: base_link
  home_pose: home
  open_pose: open
  close_pose: closed
  # Lite fingers close along flange Y; align the cylinder axis with flange X.
  # grasp_frame_transform: [0.0, 0.0, 0.13, 1.57079632679, 0.0, 1.57079632679]
  grasp_frame_transform: [0.0, 0.0, 0.13, 1.9198621771, 0.0, 1.57079632679]
  pipeline: ompl
  planner_id: RRTConnectkConfigDefault
execution:
  state_controller: joint_state_broadcaster
  controller_manager: /controller_manager
  arm_controller: joint_trajectory_controller
  gripper_controller: gen3_lite_2f_gripper_controller
  gripper_strategy: named_pose
perception:
  point_cloud_topic: /camera_head/depth/color/points
  rgb_image_topic: /camera_head/color/image_raw
  target_frame: base_link
  service_name: /perception/get_planning_scene
  params: {package: robot_bringup, file: config/scenes/kinova_perception_settings.yaml}
scene:
  known: {package: robot_bringup, file: config/scenes/kinova_known.yaml}
  perception: {package: robot_bringup, file: config/scenes/kinova_perception.yaml}
